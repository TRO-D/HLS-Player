<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HLS Player</title>
  <style>
    body{font-family:system-ui,Arial;margin:24px;background:#111;color:#eee}
    .wrap{max-width:960px;margin:0 auto}
    video{width:100%;max-height:70vh;background:#000}
    .hint{opacity:.8;margin-top:10px;font-size:14px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#eee}
    button{padding:10px 14px;border-radius:8px;border:0;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <h2>Playback</h2>
  <video id="v" controls playsinline></video>

    <div class="hint" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const videoEl = document.getElementById('v');
  const inp = document.getElementById('src');
  const msg = document.getElementById('msg');

  function getParam(name){
    const u = new URL(window.location.href);
    return u.searchParams.get(name) || '';
  }

  // base64url -> string
  function b64DecodeUnicode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const decoded = atob(str);
    try {
      return decodeURIComponent(
        Array.prototype.map.call(decoded, c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join('')
      );
    } catch {
      return decoded;
    }
  }

  function normalizeUrl(u) {
    if (!u) return '';
    // sometimes + becomes space after copy/paste in some contexts
    u = u.replace(/\s/g, '').replace(/\+/g, '%20');
    return u;
  }

  function getSrcSmart() {
    // 1) hidden variant: #v=BASE64URL
    const hash = (location.hash || '').replace(/^#/, '');
    const hp = new URLSearchParams(hash);
    const token = hp.get('v');
    if (token) return normalizeUrl(b64DecodeUnicode(token));

    // 2) fallback: ?src=
    const q = getParam('src');
    if (!q) return '';

    // decode once
    try {
      return normalizeUrl(decodeURIComponent(q));
    } catch {
      return normalizeUrl(q);
    }
  }

  function play(url){
    msg.textContent = '';
    url = normalizeUrl(url);

    if(!url){
      msg.textContent = 'No URL provided.';
      return;
    }

    inp.value = url;

    // Safari/iOS often plays HLS natively
    if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url;
      videoEl.play().catch(()=>{});
      return;
    }

    // Other browsers (incl. Firefox): hls.js
    if (window.Hls && Hls.isSupported()) {
      // reuse: destroy previous instance if any
      if (window.__hls) {
        try { window.__hls.destroy(); } catch {}
        window.__hls = null;
      }

      const hls = new Hls();
      window.__hls = hls;

      hls.loadSource(url);
      hls.attachMedia(videoEl);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        videoEl.play().catch(()=>{});
      });

      hls.on(Hls.Events.ERROR, function(_, data){
        msg.textContent = 'Playback error. Possible CORS/permissions issue on the CDN.';
      });
    } else {
      msg.textContent = 'Your browser cannot play HLS here.';
    }
  }

  document.getElementById('play').onclick = ()=>play(inp.value.trim());

  const src = getSrcSmart();
  if (src) play(src);
</script>
</body>
</html>
