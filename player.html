<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HLS Player</title>
  <style>
    body{font-family:system-ui,Arial;margin:24px;background:#111;color:#eee}
    .wrap{max-width:960px;margin:0 auto}
    video{width:100%;max-height:70vh;background:#000}
    .hint{opacity:.85;margin-top:10px;font-size:14px}

    /* Hide URL input + manual controls */
    #src, #play, .hint.manual { display:none !important; }

    /* Hide message area (we keep it for debugging if needed) */
    #msg { display:none !important; }

    /* Password overlay */
    #lock{
      position:fixed; inset:0; background:rgba(0,0,0,.92);
      display:flex; align-items:center; justify-content:center; z-index:9999;
    }
    #lock .card{
      max-width:360px; width:90%; text-align:center;
      background:#111; border:1px solid #333; border-radius:14px;
      padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    }
    #lock h2{margin:0 0 10px 0; font-size:20px}
    #pw{
      width:100%; padding:12px; border-radius:10px; border:1px solid #333;
      background:#1b1b1b; color:#eee;
    }
    #unlock{width:100%; margin-top:10px; padding:10px 14px; border-radius:10px; border:0; background:#2d6cdf; color:#fff; cursor:pointer}
    #pwmsg{margin-top:10px; opacity:.9; color:#ffb3b3; min-height:18px}

    /* Access denied overlay (no src) */
    #deny{
      position:fixed; inset:0; background:rgba(0,0,0,.94);
      display:none; align-items:center; justify-content:center; z-index:10000;
    }
    #deny .card{
      max-width:520px; width:92%; text-align:center;
      background:#111; border:1px solid #333; border-radius:14px;
      padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.5);
    }
    #deny h2{margin:0 0 8px 0; font-size:18px}
    #deny p{margin:0; opacity:.85; font-size:14px; line-height:1.4}
  </style>
</head>
<body>

<!-- Access denied (shown if opened without a trailer link) -->
<div id="deny">
  <div class="card">
    <h2>Access denied</h2>
    <p>Please open this player using an official Trailer link.</p>
  </div>
</div>

<!-- Password gate -->
<div id="lock">
  <div class="card">
    <h2>Enter password</h2>
    <input id="pw" type="password" placeholder="Password" />
    <button id="unlock">Unlock</button>
    <div id="pwmsg"></div>
  </div>
</div>

<div class="wrap">
  <h2>TRO Distribution</h2>
  <video id="v" controls playsinline></video>

  <!-- kept in DOM but hidden by CSS above -->
  <div class="hint manual">If it doesn’t start, paste the .m3u8 URL here:</div>
  <input id="src" placeholder="https://.../stream.m3u8" />
  <button id="play">Play</button>
  <div class="hint" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const PASSWORD = "TRO2025";

  const videoEl = document.getElementById('v');
  const inp = document.getElementById('src');
  const msg = document.getElementById('msg');

  const lock = document.getElementById('lock');
  const pw = document.getElementById('pw');
  const unlock = document.getElementById('unlock');
  const pwmsg = document.getElementById('pwmsg');

  const deny = document.getElementById('deny');

  function getParam(name){
    const u = new URL(window.location.href);
    return u.searchParams.get(name) || '';
  }

  // base64url -> string
  function b64DecodeUnicode(str) {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    const decoded = atob(str);
    try {
      return decodeURIComponent(
        Array.prototype.map.call(decoded, c =>
          '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
        ).join('')
      );
    } catch {
      return decoded;
    }
  }

  function normalizeUrl(u) {
    if (!u) return '';
    u = u.replace(/\s/g, '');
    return u;
  }

  function getSrcSmart() {
    // 1) hidden variant: #v=BASE64URL
    const hash = (location.hash || '').replace(/^#/, '');
    const hp = new URLSearchParams(hash);
    const token = hp.get('v');
    if (token) return normalizeUrl(b64DecodeUnicode(token));

    // 2) fallback: ?src=
    const q = getParam('src');
    if (!q) return '';
    try {
      return normalizeUrl(decodeURIComponent(q));
    } catch {
      return normalizeUrl(q);
    }
  }

  // Only allow .m3u8 sources
  function isAllowedSrc(u) {
    return typeof u === 'string' && /\.m3u8(\?|#|$)/i.test(u);
  }

  function showDenied() {
    // Hide password UI and player controls; show deny overlay
    lock.style.display = "none";
    deny.style.display = "flex";
    // Ensure nothing plays
    try { videoEl.pause(); } catch {}
    videoEl.removeAttribute('src');
    videoEl.load();
  }

  function play(url){
    // keep silent
    msg.textContent = '';
    url = normalizeUrl(url);

    if(!url) return;
    inp.value = url;

    // Safari/iOS often plays HLS natively
    if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = url;
      videoEl.play().catch(()=>{});
      return;
    }

    // Other browsers (incl. Firefox): hls.js
    if (window.Hls && Hls.isSupported()) {
      if (window.__hls) {
        try { window.__hls.destroy(); } catch {}
        window.__hls = null;
      }

      const hls = new Hls();
      window.__hls = hls;

      hls.loadSource(url);
      hls.attachMedia(videoEl);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        videoEl.play().catch(()=>{});
      });

      // Silence errors
      hls.on(Hls.Events.ERROR, function(_, data){
        // do nothing
      });
    } else {
      // no message
    }
  }

  function setUnlockedAndPlay() {
    lock.style.display = "none";
    const src = getSrcSmart();

    // If opened without a trailer link OR link is not .m3u8 => deny
    if (!src || !isAllowedSrc(src)) {
      showDenied();
      return;
    }

    play(src);
  }

  function tryUnlock() {
    if (pw.value === PASSWORD) {
      pwmsg.textContent = "";
      setUnlockedAndPlay();
    } else {
      pwmsg.textContent = "Wrong password";
      pw.select();
    }
  }

  unlock.onclick = tryUnlock;
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

  // If someone opens the page without a valid trailer link, don't even offer password.
  // (This prevents using the player as a generic HLS tool.)
  (function precheck(){
    const src = getSrcSmart();
    if (!src || !isAllowedSrc(src)) {
      showDenied();
    }
  })();

  // Hidden manual play (kept for safety)
  document.getElementById('play').onclick = ()=>play(inp.value.trim());
</script>
</body>
</html>
