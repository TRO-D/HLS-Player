<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HLS Player</title>
  <style>
    body{font-family:system-ui,Arial;margin:24px;background:#111;color:#eee}
    .wrap{max-width:960px;margin:0 auto}
    video{width:100%;max-height:70vh;background:#000}
    .hint{opacity:.8;margin-top:10px;font-size:14px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#eee}
    button{padding:10px 14px;border-radius:8px;border:0;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <h2>Playback</h2>
  <video id="v" controls playsinline></video>

  <div class="hint">If it doesn’t start, paste the .m3u8 URL here:</div>
  <input id="src" placeholder="https://.../stream.m3u8" />
  <button id="play">Play</button>
  <div class="hint" id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const v = document.getElementById('v');
  const inp = document.getElementById('src');
  const msg = document.getElementById('msg');

  function getParam(name){
    const u = new URL(window.location.href);
    return u.searchParams.get(name) || '';
  }

  function play(url){
    msg.textContent = '';
    if(!url){ msg.textContent = 'No URL provided.'; return; }
    inp.value = url;

    // Safari/iOS often plays HLS natively
    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url;
      v.play().catch(()=>{});
      return;
    }

    // Other browsers (incl. Firefox): hls.js
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, function(_, data){
        msg.textContent = 'Playback error. Possible CORS/permissions issue on the CDN.';
      });
      v.play().catch(()=>{});
    } else {
      msg.textContent = 'Your browser cannot play HLS here.';
    }
  }

  document.getElementById('play').onclick = ()=>play(inp.value.trim());
  const src = decodeURIComponent(getParam('src'));
  if (src) play(src);
</script>
</body>
</html>
